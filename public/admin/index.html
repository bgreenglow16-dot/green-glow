<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f17">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/admin/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="طلبات Green Glow">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>إدارة الطلبات | Green Glow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0b1f17;--bg2:#10291f;--g6:#1e4a37;--gold:#cfae6b;--gold2:#e6cf9c;
      --iv:#f6f0e4;--iv2:#ece2cf;--card:#fffdf8;--ink:#14231b;--mut:#66756a;--line:#e6dcc9;
      --ok:#1f7a4d;--okbg:#dcf0e3;--warn:#a8741a;--warnbg:#fbeab8;--orange:#b4571b;--orangebg:#fbd9bd;
      --bad:#a8362a;--badbg:#f7d3cd;--idle:#5b6a60;--idlebg:#e9e4d6;--new:#2a5d8f;--newbg:#d9e8f6;
      --hd:'Alexandria',sans-serif;--bd:'IBM Plex Sans Arabic',system-ui,sans-serif;
      --ease:cubic-bezier(.16,1,.3,1);font-family:var(--bd);color:var(--ink);font-synthesis:none
    }
    *,*::before,*::after{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;min-height:100vh;background:var(--iv);background-image:radial-gradient(900px 400px at 100% -10%,rgba(30,74,55,.09),transparent 60%),radial-gradient(700px 380px at 0 0,rgba(207,174,107,.12),transparent 60%);-webkit-font-smoothing:antialiased}
    button,input,select{font:inherit;color:inherit}
    button{cursor:pointer}
    [hidden]{display:none!important}
    svg.i{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    svg.i.fill{fill:currentColor;stroke:none}

    /* top bar */
    .top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--iv);box-shadow:0 10px 30px -18px #000}
    .top-in{max-width:1240px;margin:auto;padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;gap:14px}
    .brand{display:flex;align-items:center;gap:12px}
    .brand img{width:38px;height:38px;border-radius:11px;display:block}
    .brand b{display:block;font:600 14px var(--hd);letter-spacing:.3em;direction:ltr;text-align:right}
    .brand small{display:block;color:#9fb3a4;font-size:12px;margin-top:2px}
    .top-actions{display:flex;align-items:center;gap:8px}
    .ibtn{width:42px;height:42px;border-radius:13px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--iv);display:grid;place-items:center;transition:background .2s,transform .2s}
    .ibtn:hover{background:rgba(255,255,255,.14)}.ibtn:active{transform:scale(.94)}
    .ibtn svg{width:20px;height:20px}
    .ibtn.on{position:relative}
    .ibtn.on::after{content:"";position:absolute;top:7px;inset-inline-end:7px;width:9px;height:9px;border-radius:50%;background:#2fb872;box-shadow:0 0 0 2px var(--bg2)}
    .ibtn.spin svg{animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(-360deg)}}

    main{max-width:1240px;margin:0 auto;padding:22px 20px 80px}

    /* login */
    .login{min-height:calc(100vh - 140px);display:grid;place-items:center}
    .login-card{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:28px;padding:36px 30px;box-shadow:0 40px 80px -50px rgba(11,31,23,.55);text-align:center}
    .login-card .mark{width:76px;height:76px;margin:0 auto 18px;border-radius:22px;box-shadow:0 18px 30px -16px rgba(11,31,23,.7)}
    .login-card h1{font:600 26px var(--hd);margin:0 0 6px}
    .muted{color:var(--mut)}
    .login-card form{display:grid;gap:14px;margin-top:26px;text-align:right}
    .field{position:relative}
    .field svg{position:absolute;inset-inline-start:14px;top:50%;translate:0 -50%;width:19px;height:19px;color:var(--mut);pointer-events:none}
    .field input{width:100%;height:52px;padding:0 16px;padding-inline-start:44px;border-radius:15px;border:1.5px solid var(--line);background:#fff;transition:border-color .2s,box-shadow .2s}
    .field input:focus{outline:0;border-color:var(--g6);box-shadow:0 0 0 4px rgba(30,74,55,.12)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:14px;padding:0 20px;height:48px;font-weight:600;transition:transform .2s var(--ease),box-shadow .2s,background .2s,opacity .2s;white-space:nowrap}
    .btn:active{transform:scale(.97)}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .btn.gold{background:var(--gold);color:var(--bg);box-shadow:0 14px 26px -16px rgba(207,174,107,.95)}
    .btn.gold:hover:not(:disabled){background:var(--gold2)}
    .btn.dark{background:var(--bg2);color:var(--iv)}.btn.dark:hover:not(:disabled){background:var(--g6)}
    .btn.soft{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}.btn.soft:hover:not(:disabled){box-shadow:inset 0 0 0 1.5px var(--g6)}
    .btn.danger{background:var(--badbg);color:var(--bad)}.btn.danger:hover:not(:disabled){background:#f2bdb4}
    .btn.done{background:var(--okbg);color:var(--ok)}
    .btn.sm{height:42px;padding:0 15px;font-size:14px}
    .btn.icon{width:42px;padding:0}
    .form-msg{min-height:1.4em;color:var(--bad);font-size:14px;margin:12px 0 0}

    /* stats */
    .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
    .stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;align-items:center;gap:14px;box-shadow:0 18px 30px -28px rgba(11,31,23,.5)}
    .stat .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
    .stat .ico svg{width:23px;height:23px}
    .stat b{display:block;font:600 24px/1.1 var(--hd);font-variant-numeric:tabular-nums}
    .stat span{color:var(--mut);font-size:13px}
    .stat.gold-card{background:linear-gradient(135deg,var(--bg),var(--g6));color:var(--iv);border-color:transparent}
    .stat.gold-card span{color:#b9cabd}.stat.gold-card .ico{background:rgba(207,174,107,.18);color:var(--gold2)}
    .tone-new{background:var(--newbg);color:var(--new)}.tone-warn{background:var(--warnbg);color:var(--warn)}.tone-ok{background:var(--okbg);color:var(--ok)}.tone-bad{background:var(--badbg);color:var(--bad)}.tone-idle{background:var(--idlebg);color:var(--idle)}.tone-orange{background:var(--orangebg);color:var(--orange)}

    /* toolbar */
    .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:26px 0 16px}
    .search{position:relative;flex:1 1 280px;max-width:420px}
    .search svg{position:absolute;inset-inline-start:14px;top:50%;translate:0 -50%;width:19px;height:19px;color:var(--mut);pointer-events:none}
    .search input{width:100%;height:46px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 16px;padding-inline-start:42px}
    .search input:focus{outline:0;border-color:var(--g6);box-shadow:0 0 0 4px rgba(30,74,55,.1)}
    .updated{color:var(--mut);font-size:13px;display:flex;align-items:center;gap:8px}
    .updated i{width:8px;height:8px;border-radius:50%;background:#2fb872;box-shadow:0 0 0 0 rgba(47,184,114,.6);animation:pulse 2s infinite}
    @keyframes pulse{70%,100%{box-shadow:0 0 0 8px rgba(47,184,114,0)}}
    .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
    .chips::-webkit-scrollbar{display:none}
    .chip{border:0;border-radius:999px;height:40px;padding:0 15px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;white-space:nowrap;transition:all .2s}
    .chip em{font-style:normal;font-size:12px;font-weight:700;background:var(--iv2);border-radius:999px;padding:2px 8px;min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
    .chip:hover{box-shadow:inset 0 0 0 1.5px var(--g6)}
    .chip.on{background:var(--bg2);color:var(--iv);box-shadow:none}.chip.on em{background:rgba(255,255,255,.16)}

    /* orders */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
    .order{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 22px 36px -32px rgba(11,31,23,.55);animation:rise .5s var(--ease) both;position:relative;overflow:hidden}
    .order.fresh::before{content:"";position:absolute;inset-inline:0;top:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}}
    .o-head{display:flex;align-items:center;gap:12px}
    .avatar{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--g6),var(--bg));color:var(--gold2);display:grid;place-items:center;font:600 18px var(--hd);flex:none}
    .o-name{min-width:0;flex:1}
    .o-name b{display:block;font:600 16px/1.3 var(--hd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .o-name small{color:var(--mut);font-size:12.5px;display:flex;gap:6px;align-items:center}
    .badge{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
    .badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
    .new-tag{background:var(--gold);color:var(--bg);font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px}
    .rows{display:grid;gap:10px}
    .row{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;line-height:1.55}
    .row>svg{width:20px;height:20px;color:var(--g6);margin-top:2px;flex:none}
    .row b{font-weight:600}
    .row small{display:block;color:var(--mut);font-size:13px}
    .phone-row{justify-content:space-between;align-items:center}
    .phone-row .num{direction:ltr;font:600 17px var(--hd);letter-spacing:.04em;font-variant-numeric:tabular-nums}
    .phone-row .acts{display:flex;gap:8px}
    .circle{width:40px;height:40px;border-radius:50%;border:0;padding:0;cursor:pointer;display:grid;place-items:center;text-decoration:none;transition:transform .2s var(--ease)}
    .circle:hover{transform:translateY(-2px)}
    .circle svg{width:19px;height:19px}
    .circle.call{background:var(--bg2);color:var(--gold2)}.circle.wa{background:#25d366;color:#fff}
    .pill{display:inline-flex;align-items:center;gap:6px;background:var(--iv2);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:500;margin-inline-start:6px}
    .pill svg{width:15px;height:15px}
    .price-row{display:flex;justify-content:space-between;align-items:center;background:var(--iv);border-radius:16px;padding:12px 16px}
    .price-row span{color:var(--mut);font-size:13px}
    .price-row b{font:600 22px var(--hd);font-variant-numeric:tabular-nums}
    .note{background:#fff7e0;border:1px dashed #e3c880;border-radius:14px;padding:10px 14px;font-size:13.5px;color:#6b5314;display:flex;gap:8px}
    .note svg{width:18px;height:18px;margin-top:2px;flex:none}
    .o-foot{border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:10px}
    .ctrl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .sel,.trk{position:relative}
    .sel select,.trk input{width:100%;height:46px;border-radius:13px;border:1.5px solid var(--line);background:#fff;padding:0 14px}
    .sel select{appearance:none;font-weight:600;padding-inline-end:36px}
    .sel svg{position:absolute;inset-inline-end:12px;top:50%;translate:0 -50%;width:16px;height:16px;pointer-events:none;color:var(--mut)}
    .trk input{padding-right:40px;padding-left:12px;direction:ltr;text-align:right}
    .trk svg{position:absolute;inset-inline-start:13px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--mut);pointer-events:none}
    .sel select:focus,.trk input:focus{outline:0;border-color:var(--g6);box-shadow:0 0 0 4px rgba(30,74,55,.1)}
    .btns{display:flex;gap:8px}
    .btns .btn:not(.icon){flex:1}

    .tabs{display:inline-flex;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:4px;gap:4px;margin-bottom:20px}
    .tab{border:0;background:transparent;border-radius:12px;height:42px;padding:0 22px;font-weight:600;color:var(--mut);transition:all .2s}
    .tab.on{background:var(--bg2);color:var(--iv)}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 18px 30px -28px rgba(11,31,23,.5)}
    .panel h3{font:600 16px var(--hd);margin:0 0 14px;display:flex;align-items:center;gap:10px}
    .panel h3 svg{width:20px;height:20px;color:var(--g6)}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
    .kpi{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px}
    .kpi span{display:block;color:var(--mut);font-size:13px}
    .kpi b{display:block;font:600 24px/1.2 var(--hd);margin-top:4px;font-variant-numeric:tabular-nums}
    .kpi small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
    .kpi.profit{background:linear-gradient(135deg,var(--bg),var(--g6));color:var(--iv);border-color:transparent}
    .kpi.profit span,.kpi.profit small{color:#b9cabd}
    .kpi.neg b{color:#ffb4a8}
    .stats-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
    .bars{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:8px}
    .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;min-width:0;height:100%}
    .bar i{display:block;width:100%;max-width:26px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--gold),#b9953f);min-height:3px;transition:height .5s var(--ease)}
    .bar i.zero{background:var(--line)}
    .bar em{font-style:normal;font-size:10.5px;color:var(--mut);white-space:nowrap}
    .bar b{font-size:11px;font-weight:700}
    .rank{display:grid;gap:10px}
    .rank div{display:grid;gap:4px}
    .rank .line{display:flex;justify-content:space-between;font-size:14px}
    .rank small{color:var(--mut);font-size:12px}
    .meter{height:8px;border-radius:99px;background:var(--iv2);overflow:hidden}
    .meter i{display:block;height:100%;background:var(--g6);border-radius:99px}
    .periods{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
    .set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px;margin-bottom:14px}
    .set-grid label{display:grid;gap:6px;font-size:13px;color:var(--mut);min-width:0}
    .stats-grid>*,.kpis>*,.panel{min-width:0}
    .set-grid input{width:100%;min-width:0;height:46px;border-radius:13px;border:1.5px solid var(--line);background:#fff;padding:0 14px;color:var(--ink);font-weight:600}
    .set-grid input:focus{outline:0;border-color:var(--g6);box-shadow:0 0 0 4px rgba(30,74,55,.1)}
    .hint{color:var(--mut);font-size:13px;line-height:1.7;margin:10px 0 0}
    .pills{display:flex;flex-wrap:wrap;gap:6px}
    .pills:empty{display:none}
    .rpill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600}
    .rpill svg{width:15px;height:15px}
    .wa-list{display:grid;gap:8px;margin:6px 0 14px}
    .wa-list a{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;transition:border-color .2s,transform .2s}
    .wa-list a:hover{border-color:#25d366;transform:translateY(-1px)}
    .wa-list a svg{width:22px;height:22px;color:#1faa57;flex:none}
    .wa-list b{display:block;font-size:14.5px}
    .wa-list small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
    .wa-list a.best{border-color:#25d366;background:#effaf3}
    .pills{display:flex;flex-wrap:wrap;gap:6px}
    .pills:empty{display:none}
    .rpill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600}
    .rpill svg{width:15px;height:15px}
    .wa-list{display:grid;gap:8px;margin:6px 0 14px}
    .wa-list a{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;transition:border-color .2s,transform .2s}
    .wa-list a:hover{border-color:#25d366;transform:translateY(-1px)}
    .wa-list a svg{width:22px;height:22px;color:#1faa57;flex:none}
    .wa-list b{display:block;font-size:14.5px}
    .wa-list small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
    .wa-list a.best{border-color:#25d366;background:#effaf3}
    .tools{display:flex;align-items:center;gap:14px}
    .ship-strip{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;background:#fff}
    .ship-strip .sdot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 4px rgba(0,0,0,.06)}
    .ship-strip .stext{flex:1;min-width:0}
    .ship-strip b{display:block;font-size:14.5px;font-weight:600}
    .ship-strip small{display:block;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ship-strip .btn{height:38px;padding:0 13px;font-size:13.5px}
    dialog.track{width:min(500px,94vw);max-height:88vh;overflow:auto}
    .tk-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
    .tk-head .sdot{width:16px;height:16px;border-radius:50%;flex:none}
    .tk-head b{display:block;font:600 18px var(--hd)}
    .tk-head small{color:var(--mut)}
    .tk-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
    .tk-meta div{background:var(--iv);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--mut)}
    .tk-meta b{display:block;color:var(--ink);font-size:15px;margin-top:2px}
    .tk-code{direction:ltr;text-align:right;font-family:var(--hd);letter-spacing:.04em}
    .timeline{list-style:none;margin:0 0 6px;padding:0;position:relative}
    .timeline li{position:relative;padding:0 26px 18px 0}
    .timeline li::before{content:"";position:absolute;right:6px;top:18px;bottom:-2px;width:2px;background:var(--line)}
    .timeline li:last-child::before{display:none}
    .timeline .dot{position:absolute;right:0;top:5px;width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 4px #fff}
    .timeline b{display:block;font-size:14.5px}
    .timeline small{display:block;color:var(--mut);font-size:12.5px}
    .timeline em{display:block;font-style:normal;font-size:13px;margin-top:3px;color:#6b5314}
    .tk-loading{padding:30px 0;text-align:center;color:var(--mut)}
    .empty{text-align:center;padding:70px 20px;color:var(--mut)}
    .empty svg{width:56px;height:56px;color:var(--gold);margin-bottom:10px;stroke-width:1.4}
    .empty b{display:block;color:var(--ink);font:600 18px var(--hd);margin-bottom:4px}

    /* toasts + dialog */
    .toasts{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:10px;z-index:60;pointer-events:none;padding:0 14px}
    .toast{pointer-events:auto;background:var(--bg);color:var(--iv);padding:13px 18px;border-radius:16px;box-shadow:0 20px 40px -14px #000a;display:flex;align-items:center;gap:10px;max-width:min(520px,100%);font-size:14.5px;animation:rise .35s var(--ease) both}
    .toast svg{width:20px;height:20px;flex:none;color:var(--gold2)}
    .toast.err svg{color:#ff9d8f}.toast.ok svg{color:#6fe0a2}
    dialog{border:0;border-radius:24px;padding:26px;width:min(440px,92vw);background:var(--card);color:var(--ink);box-shadow:0 40px 90px -30px #000}
    dialog::backdrop{background:rgba(5,15,10,.6);backdrop-filter:blur(3px)}
    dialog h2{font:600 19px var(--hd);margin:0 0 6px}
    dialog p{color:var(--mut);margin:0 0 14px;font-size:14.5px}
    dialog select{width:100%;height:48px;border-radius:13px;border:1.5px solid var(--line);padding:0 12px;background:#fff;margin-bottom:16px}
    dialog .btns{margin-top:4px}

    @media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.stats-grid{grid-template-columns:1fr}}
    @media(max-width:700px){
      main{padding:16px 14px 90px}.top-in{padding-inline:14px}
      .stats{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;gap:10px;flex-direction:column;align-items:flex-start}.stat b{font-size:21px}
      .stat.wide{grid-column:1/-1;flex-direction:row;align-items:center}
      .grid{grid-template-columns:1fr}
      .brand small{display:none}
      .updated{display:none}
      .tools{width:100%}.tools .btn{width:100%}
      .search{max-width:none}
    }
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="top">
    <div class="top-in">
      <div class="brand">
        <img src="/favicon.svg" alt="" width="38" height="38">
        <div><b>GREEN GLOW</b><small>لوحة إدارة الطلبات</small></div>
      </div>
      <div class="top-actions">
        <button id="notify" class="ibtn" type="button" title="إشعارات الطلبات الجديدة" aria-label="إشعارات الطلبات الجديدة" hidden></button>
        <button id="refresh" class="ibtn" type="button" title="تحديث" aria-label="تحديث" hidden></button>
        <button id="logout" class="ibtn" type="button" title="تسجيل الخروج" aria-label="تسجيل الخروج" hidden></button>
      </div>
    </div>
  </header>

  <main>
    <section id="login-panel" class="login" hidden>
      <div class="login-card">
        <img class="mark" src="/apple-touch-icon.png" alt="Green Glow">
        <h1>مرحبا بعودتك</h1>
        <p class="muted">سجّل الدخول لإدارة طلبات الزبائن.</p>
        <form id="login-form">
          <div class="field" id="pw-field">
            <input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور" aria-label="كلمة المرور" required>
          </div>
          <button id="login-button" class="btn gold" type="submit">دخول</button>
        </form>
        <p id="login-message" class="form-msg" role="alert"></p>
      </div>
    </section>

    <section id="orders-panel" hidden>
      <nav class="tabs" id="tabs" role="tablist">
        <button class="tab on" type="button" role="tab" data-tab="orders" aria-selected="true">الطلبات</button>
        <button class="tab" type="button" role="tab" data-tab="stats" aria-selected="false">الإحصائيات</button>
      </nav>
      <div id="view-stats" hidden></div>
      <div id="view-orders">
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <div class="search" id="search-wrap"><input id="search" type="search" placeholder="ابحث بالاسم أو الهاتف أو الولاية أو رقم التتبع" aria-label="بحث"></div>
        <div class="tools"><button id="sync" class="btn soft sm" type="button"></button><div class="updated"><i></i><span id="last-updated">جار التحميل...</span></div></div>
      </div>
      <div class="chips" id="chips" role="tablist" aria-label="تصفية حسب الحالة"></div>
      <div class="grid" id="orders-list"></div>
      <div class="empty" id="empty" hidden></div>
      </div>
    </section>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/admin.js" defer></script>
</body>
</html>
